{% extends "base.html" %}
{% block title %}ลืมรหัสผ่าน - Teacher Platform{% endblock %}

{% block extra_css %}
<style>
  .auth-container {
    max-width: 420px;
    margin: 3rem auto;
    background: white;
    padding: 2rem;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    border: 1px solid rgba(0,0,0,0.06);
  }
  
  .auth-header {
    text-align: center;
    margin-bottom: 1.5rem;
  }
  
  .auth-header .icon {
    font-size: 3rem;
    margin-bottom: 0.5rem;
  }
  
  .auth-header h2 {
    color: #1e293b;
    font-size: 1.5rem;
    margin: 0 0 0.5rem;
  }
  
  .auth-header p {
    color: #64748b;
    font-size: 0.9rem;
    margin: 0;
  }
  
  .form-group {
    margin-bottom: 1rem;
  }
  
  .form-group label {
    display: block;
    font-weight: 700;
    margin-bottom: 0.4rem;
    color: #334155;
  }
  
  .form-group input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    font-size: 1rem;
    transition: all 0.2s;
  }
  
  .form-group input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.12);
  }
  
  .btn-submit {
    width: 100%;
    padding: 0.85rem;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 0.5rem;
  }
  
  .btn-submit:hover {
    opacity: 0.9;
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(102,126,234,0.3);
  }
  
  .auth-links {
    margin-top: 1.5rem;
    text-align: center;
  }
  
  .auth-links a {
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
  }
  
  .auth-links a:hover {
    text-decoration: underline;
  }
  
  .info-box {
    background: #fef3c7;
    border: 1px solid #fcd34d;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 1rem;
    font-size: 0.85rem;
    color: #92400e;
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-header">
    <div class="icon">🔐</div>
    <h2>ลืมรหัสผ่าน</h2>
    <p>กรอกอีเมลเพื่อรับลิงก์รีเซ็ตรหัสผ่าน</p>
  </div>

  <div class="info-box">
    ⚠️ ลิงก์รีเซ็ตรหัสผ่านจะมีอายุ 1 ชั่วโมง
  </div>

  <form method="POST">
    <div class="form-group">
      <label for="email">อีเมล</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com">
    </div>
    
    <button type="submit" class="btn-submit">📧 ส่งลิงก์รีเซ็ตรหัสผ่าน</button>
  </form>
  
  <div class="auth-links">
    <a href="{{ url_for('auth.login') }}">← กลับไปหน้าเข้าสู่ระบบ</a>
  </div>
</div>
{% endblock %}
