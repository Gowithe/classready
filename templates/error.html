{% extends "base.html" %}

{% block title %}Error {{ error_code }}{% endblock %}

{% block content %}
<div class="container" style="max-width:720px;margin:40px auto;padding:24px;">
  <div class="card" style="padding:24px;border-radius:16px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06);">
    <h2 style="margin:0 0 10px;">Error {{ error_code }}</h2>
    <p style="margin:0 0 18px;">{{ error_msg }}</p>

    <a class="btn" href="{{ url_for('auth.landing') }}">Back to Home</a>
  </div>
</div>
{% endblock %}
