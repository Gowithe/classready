{% extends "base.html" %}
{% block title %}บันทึกสไลด์{% endblock %}

{% block content %}
<div style="max-width:500px;margin:3rem auto;text-align:center;padding:2rem;">
  <div class="loading-spinner" style="width:50px;height:50px;border:4px solid #e2e8f0;border-top-color:#667eea;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem;"></div>
  <style>@keyframes spin{to{transform:rotate(360deg);}}</style>
  <h2>⏳ กำลังบันทึกสไลด์ของคุณ...</h2>
  <p id="statusMsg" style="color:#64748b;">กำลังบันทึก...</p>
</div>

<script>
(async function(){
  const taskId = sessionStorage.getItem('trySlides_taskId');
  const msg = document.getElementById('statusMsg');

  if(!taskId){
    msg.textContent = 'ไม่พบสไลด์ที่ต้องบันทึก กำลังกลับหน้าหลัก...';
    setTimeout(() => window.location.href = '/dashboard', 2000);
    return;
  }

  try{
    const res = await fetch('/try-slides/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task_id: taskId })
    });
    const data = await res.json();
    sessionStorage.removeItem('trySlides_taskId');

    if(data.ok && data.redirect){
      msg.textContent = '✅ บันทึกเรียบร้อย! กำลังเปิดหน้าบทเรียน...';
      window.location.href = data.redirect;
    } else {
      msg.textContent = '❌ ' + (data.error || 'บันทึกไม่สำเร็จ');
      setTimeout(() => window.location.href = '/dashboard', 3000);
    }
  } catch(err) {
    msg.textContent = '❌ Error: ' + err.message;
    setTimeout(() => window.location.href = '/dashboard', 3000);
  }
})();
</script>
{% endblock %}
