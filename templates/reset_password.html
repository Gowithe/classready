{% extends "base.html" %}
{% block title %}ตั้งรหัสผ่านใหม่ - Teacher Platform{% endblock %}

{% block extra_css %}
<style>
  .auth-container {
    max-width: 420px;
    margin: 3rem auto;
    background: white;
    padding: 2rem;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    border: 1px solid rgba(0,0,0,0.06);
  }
  
  .auth-header {
    text-align: center;
    margin-bottom: 1.5rem;
  }
  
  .auth-header .icon {
    font-size: 3rem;
    margin-bottom: 0.5rem;
  }
  
  .auth-header h2 {
    color: #1e293b;
    font-size: 1.5rem;
    margin: 0 0 0.5rem;
  }
  
  .auth-header p {
    color: #64748b;
    font-size: 0.9rem;
    margin: 0;
  }
  
  .form-group {
    margin-bottom: 1rem;
  }
  
  .form-group label {
    display: block;
    font-weight: 700;
    margin-bottom: 0.4rem;
    color: #334155;
  }
  
  .form-group input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    font-size: 1rem;
    transition: all 0.2s;
  }
  
  .form-group input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.12);
  }
  
  .btn-submit {
    width: 100%;
    padding: 0.85rem;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 0.5rem;
  }
  
  .btn-submit:hover {
    opacity: 0.9;
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(34,197,94,0.3);
  }
  
  .auth-links {
    margin-top: 1.5rem;
    text-align: center;
  }
  
  .auth-links a {
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
  }
  
  .auth-links a:hover {
    text-decoration: underline;
  }
  
  .password-hint {
    font-size: 0.8rem;
    color: #64748b;
    margin-top: 4px;
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-header">
    <div class="icon">🔑</div>
    <h2>ตั้งรหัสผ่านใหม่</h2>
    <p>กรอกรหัสผ่านใหม่ที่ต้องการใช้</p>
  </div>

  <form method="POST">
    <div class="form-group">
      <label for="password">รหัสผ่านใหม่</label>
      <input type="password" id="password" name="password" required placeholder="••••••••" minlength="6">
      <div class="password-hint">อย่างน้อย 6 ตัวอักษร</div>
    </div>
    
    <div class="form-group">
      <label for="confirm_password">ยืนยันรหัสผ่านใหม่</label>
      <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••">
    </div>
    
    <button type="submit" class="btn-submit">✅ บันทึกรหัสผ่านใหม่</button>
  </form>
  
  <div class="auth-links">
    <a href="{{ url_for('login') }}">← กลับไปหน้าเข้าสู่ระบบ</a>
  </div>
</div>
{% endblock %}
