<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>{{ freebie.title }}</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#1a1a2e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
    .topbar{
      position:sticky;top:0;z-index:100;
      background:rgba(15,23,42,.95);backdrop-filter:blur(10px);
      color:#e2e8f0;padding:10px 16px;
      display:flex;justify-content:space-between;align-items:center;
      border-bottom:1px solid rgba(255,255,255,.1);
    }
    .topbar h1{font-size:.9rem;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70vw;}
    .topbar .badge{font-size:.7rem;color:#94a3b8;margin-top:2px;}
    .page-count{
      background:rgba(255,255,255,.12);padding:6px 12px;border-radius:8px;
      font-size:.8rem;font-weight:700;white-space:nowrap;
    }
    .pages{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;}
    .pages canvas{width:100%;display:block;}
    .loading-box{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:4rem 1rem;color:#94a3b8;
    }
    .spinner{
      width:40px;height:40px;border:4px solid rgba(255,255,255,.15);
      border-top-color:#667eea;border-radius:50%;
      animation:spin .8s linear infinite;margin-bottom:1rem;
    }
    @keyframes spin{to{transform:rotate(360deg);}}
    .error-msg{color:#f87171;text-align:center;padding:2rem;}
    .error-msg a{color:#667eea;font-weight:700;}
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>📄 {{ freebie.title }}</h1>
      <div class="badge">Clazzee.com</div>
    </div>
    <div class="page-count" id="pageCount">⏳</div>
  </div>

  <div class="pages" id="pages">
    <div class="loading-box" id="loadingBox">
      <div class="spinner"></div>
      <div>กำลังโหลด...</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
  const pdfUrl = "{{ pdf_url }}";
  const pagesDiv = document.getElementById('pages');
  const loadingBox = document.getElementById('loadingBox');
  const pageCountEl = document.getElementById('pageCount');

  async function renderAllPages(){
    try {
      if(typeof pdfjsLib === 'undefined') throw new Error('PDF.js not loaded');
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
      const total = pdf.numPages;
      pageCountEl.textContent = total + ' หน้า';
      loadingBox.remove();

      for(let i = 1; i <= total; i++){
        const page = await pdf.getPage(i);
        const vp = page.getViewport({scale: 1});
        const screenW = window.innerWidth;
        const scale = (screenW / vp.width) * 2; // 2x for retina
        const viewport = page.getViewport({scale});

        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = screenW + 'px';
        canvas.style.height = Math.floor(screenW * (vp.height / vp.width)) + 'px';
        pagesDiv.appendChild(canvas);

        await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
      }
    } catch(e) {
      console.error(e);
      loadingBox.innerHTML = '<div class="error-msg">โหลด PDF ไม่สำเร็จ<br><a href="' + pdfUrl + '">กดที่นี่เพื่อดาวน์โหลด</a></div>';
      pageCountEl.textContent = '❌';
    }
  }

  renderAllPages();
  </script>
</body>
</html>
