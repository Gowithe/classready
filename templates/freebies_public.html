{% extends "base.html" %}
{% block title %}{{ freebie.title }}{% endblock %}

{% block extra_css %}
<style>
  body{background:#0f172a;}
  .pres-wrap{
    max-width:1400px;margin:1rem auto;
    background:#0b1220;border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);overflow:hidden;
  }
  .pres-topbar{
    display:flex;justify-content:space-between;align-items:center;
    gap:12px;padding:14px 18px;background:rgba(255,255,255,.06);
    color:#e6eefc;flex-wrap:wrap;
  }
  .pres-title{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
  .pres-title h2{margin:0;font-size:1rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pres-title .muted{opacity:.7;font-size:.78rem;}
  .pres-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .pres-controls button{
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
    color:#fff;padding:9px 14px;border-radius:10px;cursor:pointer;
    font-weight:700;font-size:.85rem;transition:all .15s;
  }
  .pres-controls button:hover{background:rgba(255,255,255,.2);}
  .pres-controls button.active{background:#ef4444;border-color:#ef4444;}
  .pres-controls button:disabled{opacity:.4;cursor:not-allowed;}
  .counter{
    background:rgba(255,255,255,.12);padding:9px 14px;border-radius:10px;
    font-weight:800;min-width:80px;text-align:center;color:#fff;font-size:.85rem;
  }

  .stage{
    position:relative;background:#050913;
    display:flex;justify-content:center;align-items:center;
    height:78vh;min-height:520px;padding:20px;
  }
  #pdfCanvas{max-width:100%;max-height:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#fff;}
  .nav-arrow{
    position:absolute;top:50%;transform:translateY(-50%);
    width:50px;height:50px;border-radius:50%;
    background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.25);
    color:#fff;font-size:1.5rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;z-index:10;
  }
  .nav-arrow:hover{background:rgba(255,255,255,.3);transform:translateY(-50%) scale(1.1);}
  .nav-arrow:disabled{opacity:.3;cursor:not-allowed;transform:translateY(-50%);}
  .nav-arrow.prev{left:20px;}
  .nav-arrow.next{right:20px;}

  .laser{
    position:fixed;width:18px;height:18px;border-radius:50%;
    background:radial-gradient(circle,#ff1744 0%, rgba(255,23,68,.6) 45%, transparent 70%);
    box-shadow:0 0 22px rgba(255,23,68,.75), 0 0 50px rgba(255,23,68,.45);
    pointer-events:none;z-index:99999;display:none;
    transform:translate(-50%,-50%);
  }
  .laser.on{display:block;}

  .loading{color:#94a3b8;font-size:1rem;}

  .pres-wrap:fullscreen{max-width:none;width:100vw;height:100vh;border-radius:0;display:flex;flex-direction:column;margin:0;}
  .pres-wrap:fullscreen .stage{flex:1;height:auto;}
</style>
{% endblock %}

{% block content %}
<div class="pres-wrap" id="presWrap">
  <div class="pres-topbar">
    <div class="pres-title">
      <h2>📄 {{ freebie.title }}</h2>
      <div class="muted">← → เลื่อน | P = Pointer | F = Fullscreen</div>
    </div>
    <div class="pres-controls">
      <button id="prevBtn" title="ก่อนหน้า (←)">← ก่อนหน้า</button>
      <div class="counter"><span id="pageNum">1</span> / <span id="pageTotal">?</span></div>
      <button id="nextBtn" title="ถัดไป (→)">ถัดไป →</button>
      <button id="pointerBtn" title="Pointer (P)">🔴 Pointer</button>
      <button id="fsBtn" title="Fullscreen (F)">⛶ Fullscreen</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <button class="nav-arrow prev" id="prevArrow">←</button>
    <canvas id="pdfCanvas"></canvas>
    <iframe id="pdfFallback" style="display:none;width:100%;height:100%;border:none;background:#fff;border-radius:8px;"></iframe>
    <div class="loading" id="loadingMsg">⏳ กำลังโหลด PDF...</div>
    <button class="nav-arrow next" id="nextArrow">→</button>
  </div>
  <div class="laser" id="laser"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const pdfUrl = "{{ url_for('freebies.freebies_public_pdf', token=freebie.share_token) }}";
const canvas = document.getElementById('pdfCanvas');
const ctx = canvas.getContext('2d');
const presWrap = document.getElementById('presWrap');
const loadingMsg = document.getElementById('loadingMsg');
const fallbackFrame = document.getElementById('pdfFallback');

let pdfDoc = null;
let currentPage = 1;
let rendering = false;
let pendingPage = null;
let useFallback = false;

async function renderPage(num){
  if(!pdfDoc) return;
  rendering = true;
  const page = await pdfDoc.getPage(num);
  const stage = document.getElementById('stage');
  const maxW = stage.clientWidth - 120;
  const maxH = stage.clientHeight - 40;
  const vp1 = page.getViewport({scale:1});
  const scale = Math.min(maxW / vp1.width, maxH / vp1.height);
  const viewport = page.getViewport({scale});
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  canvas.style.display = 'block';
  loadingMsg.style.display = 'none';
  await page.render({canvasContext:ctx, viewport}).promise;
  rendering = false;
  document.getElementById('pageNum').textContent = num;
  updateButtons();
  if(pendingPage !== null){ const p = pendingPage; pendingPage = null; renderPage(p); }
}

function goPage(num){
  if(useFallback) return;
  if(!pdfDoc || num < 1 || num > pdfDoc.numPages) return;
  currentPage = num;
  if(rendering){ pendingPage = num; } else { renderPage(num); }
}

function updateButtons(){
  if(!pdfDoc) return;
  document.getElementById('prevBtn').disabled = currentPage <= 1;
  document.getElementById('nextBtn').disabled = currentPage >= pdfDoc.numPages;
  document.getElementById('prevArrow').disabled = currentPage <= 1;
  document.getElementById('nextArrow').disabled = currentPage >= pdfDoc.numPages;
}

function showFallback(){
  useFallback = true;
  canvas.style.display = 'none';
  loadingMsg.style.display = 'none';
  fallbackFrame.src = pdfUrl + '#view=FitH&toolbar=1';
  fallbackFrame.style.display = 'block';
  document.getElementById('prevArrow').style.display = 'none';
  document.getElementById('nextArrow').style.display = 'none';
  document.getElementById('pageNum').textContent = '-';
  document.getElementById('pageTotal').textContent = '-';
}

(async () => {
  try {
    if(typeof pdfjsLib === 'undefined') throw new Error('PDF.js not loaded');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
    document.getElementById('pageTotal').textContent = pdfDoc.numPages;
    await renderPage(1);
  } catch(e){
    console.warn('PDF.js failed, using iframe fallback:', e);
    showFallback();
  }
})();

document.getElementById('prevBtn').onclick = () => goPage(currentPage - 1);
document.getElementById('nextBtn').onclick = () => goPage(currentPage + 1);
document.getElementById('prevArrow').onclick = () => goPage(currentPage - 1);
document.getElementById('nextArrow').onclick = () => goPage(currentPage + 1);

let pointerOn = false;
const laser = document.getElementById('laser');
const pointerBtn = document.getElementById('pointerBtn');
function togglePointer(){
  pointerOn = !pointerOn;
  pointerBtn.classList.toggle('active', pointerOn);
  if(!pointerOn) laser.classList.remove('on');
}
pointerBtn.onclick = togglePointer;
document.addEventListener('mousemove', e => {
  if(!pointerOn) return;
  laser.style.left = e.clientX + 'px';
  laser.style.top = e.clientY + 'px';
  laser.classList.add('on');
});

function toggleFS(){
  if(!document.fullscreenElement) presWrap.requestFullscreen?.();
  else document.exitFullscreen?.();
}
document.getElementById('fsBtn').onclick = toggleFS;

let resizeTimer;
function rerender(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if(pdfDoc) renderPage(currentPage); }, 150);
}
window.addEventListener('resize', rerender);
document.addEventListener('fullscreenchange', rerender);

document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if(e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){ e.preventDefault(); goPage(currentPage + 1); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); goPage(currentPage - 1); }
  else if(e.key.toLowerCase() === 'f'){ e.preventDefault(); toggleFS(); }
  else if(e.key.toLowerCase() === 'p'){ e.preventDefault(); togglePointer(); }
  else if(e.key === 'Escape' && pointerOn){ togglePointer(); }
});
</script>
{% endblock %}
